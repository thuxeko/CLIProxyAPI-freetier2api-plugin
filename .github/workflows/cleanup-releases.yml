name: Cleanup Bad Releases

# Workflow tạm: xoá các release rác do lỗi nối chuỗi tag (-vi-vi, -vi-vi-vi).
# Chạy tự động khi file này được push. Có thể xoá file này sau khi dọn xong.

on:
  push:
    paths:
      - '.github/workflows/cleanup-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Xoá các release rác
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for TAG in v0.1.21-vi-vi v0.1.21-vi-vi-vi; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Đang xoá release $TAG ..."
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag && echo "OK: $TAG"
            else
              echo "Bỏ qua (không tồn tại): $TAG"
            fi
          done
          echo "--- Còn lại ---"
          gh release list --repo "$REPO"
